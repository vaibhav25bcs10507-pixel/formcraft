services:
  formo:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-please}
      - AUTH_SECRET=${AUTH_SECRET:-please-change-this-to-a-long-random-string}
      # Optional: enable AI form generation
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
    volumes:
      - formo-data:/data
    restart: unless-stopped

volumes:
  formo-data:
