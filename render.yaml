services:
  - type: web
    name: formcraft
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: ./data
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Optional: enable AI form generation
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
